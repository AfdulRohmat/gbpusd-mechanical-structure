phase: phase3_price_action_state_machine
status: preregistered_before_state_coverage

source:
  video_url: https://youtu.be/TegF3yYjnng
  transcript_role: hypothesis_source_only
  unverified_claims_are_assumptions: true

scope:
  construction_year: 2024
  historical_replication_year: 2025
  sessions: [london, new_york]
  regime_timeframe: 15min
  setup_timeframe: 5min
  returns_access_allowed: false
  pnl_access_allowed: false
  historical_replication_access_allowed: false

m15_regime:
  atr_period: 14
  swing_left_bars: 2
  swing_right_bars: 2
  trend_definition: latest_confirmed_hh_hl_or_lh_ll
  trendline_definition: last_two_confirmed_opposing_pivots
  trendline_break_confirmation: close
  trendline_break_buffer_atr: 0.05
  final_extreme_near_equal_tolerance_atr: 0.10
  opposite_proven_trend_overrides_pending_extreme: true
  range_window_bars: 20
  range_minimum_swing_touches_per_side: 2
  range_boundary_cluster_tolerance_atr: 0.25
  range_efficiency_maximum: 0.35
  range_width_minimum_atr: 1.00
  range_width_maximum_atr: 4.00
  range_breakout_buffer_atr: 0.05
  range_acceptance_consecutive_closes: 2
  range_retest_tolerance_atr: 0.10
  range_resolution_bars: 6
  range_middle_fraction: [0.35, 0.65]

m5_setup:
  ema_period: 21
  key_entry_sources: [ema21, projected_m15_trendline, frozen_range_boundary]
  key_entry_tolerance_m15_atr: 0.20
  leg_new_extreme_buffer_m15_atr: 0.05
  maximum_bars_between_pullback_attempts: 18
  signal_bar_minimum_body_fraction: 0.50
  signal_bar_minimum_close_location: 0.65
  signal_bar_minimum_range_m5_atr: 0.25
  signal_wait_bars_after_m15_event: 3
  entry_trigger_buffer_pips: 0.10
  entry_trigger_valid_bars: 2
  setup_families:
    - with_trend_second_entry
    - failed_range_break_fade
    - accepted_breakout_pullback
  maximum_selected_setups_per_session:
    london: 1
    new_york: 2

congestion_veto:
  lookback_m5_bars: 6
  maximum_total_range_m5_atr: 1.50
  minimum_mean_adjacent_overlap: 0.60

coverage_gate:
  require_zero_invariant_failures: true
  minimum_classified_m15_fraction: 0.60
  minimum_setup_signals_per_year: 120
  minimum_triggered_setups_per_year: 120
  desired_triggered_setups_per_year: [240, 480]
  minimum_trigger_rate: 0.50
  minimum_each_session: 30
  minimum_each_direction: 30
  no_eligible_setup_action: stop_without_pnl
  eligible_setup_action: freeze_before_construction_pnl
