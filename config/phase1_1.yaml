phase: phase1_1_full_session_setups
status: preregistered_after_phase1
parent:
  branch: phase/01-nested-price-baselines
  fingerprint: daac4b3ee86ac545

scope:
  sessions: [london, new_york]
  construction_year: 2024
  replication_year: 2025
  price_only: true
  excluded_features:
    - order_block
    - h1_support_resistance
    - fundamental_bias
    - ema
    - rsi

opportunity:
  maximum_trades_per_model_session: 1
  setup_signal_window: full_session
  setup_selection: first_candidate_satisfying_each_model
  require_session_open_m5_bar: true
  decision_must_be_before_cutoff: true
  minimum_minutes_remaining: 0
  window_end:
    london: new_york_open
    new_york: fx_day_boundary

baselines:
  - id: p0_session_drift
    signal: fitted_fixed_session_direction
  - id: p1_h4_momentum
    signal: latest_completed_h4_close_change
  - id: p2_h4_sr
    signal: first_causal_h4_zone_breakout_or_rejection
  - id: p3_m15_structure
    signal: first_m15_bos_or_choch
  - id: p4_top_down_structure
    signal: first_m15_structure_aligned_with_h1_and_h4_context
  - id: p5_top_down_structure_fvg
    signal: first_aligned_structure_with_displacement_and_directional_fvg

session_drift_fit:
  fit_period: construction
  fit_separately_by_session: true
  candidates: [long, short]
  objective: mean_primary_net_r
  tie_break: long

support_resistance_signal:
  source_timeframe: 4H
  setup_timeframe: 15min
  require_zone_active_before_setup_bar: true
  maximum_zone_age_h4_bars: 500
  breakout_close_buffer_atr: 0.05
  candidate_order: [normalized_distance, breakout_before_rejection, zone_id]

structure_signal:
  setup_timeframe: 15min
  event_types: [bos, choch]
  top_down_context_timeframes: [1H, 4H]
  daily_role: report_stratum_only
  fvg_same_bar_required: true
  fvg_same_direction_required: true
  displacement_required_for_fvg_model: true

risk:
  stop_atr: 1.0
  target_r: 2.0
  atr_source: signal_m15_atr
  bracket_anchor: observed_entry_quote_before_slippage
  management_cutoff:
    london: new_york_open
    new_york: fx_day_boundary
  force_flat_at_cutoff: true
  concurrent_positions_per_model: 1

statistics:
  comparison_unit: session_day_opportunity
  no_trade_return_r: 0.0
  bootstrap_unit: fx_session_date
  bootstrap_resamples: 10000
  confidence_level: 0.95
  primary_period: replication
  construction_is_descriptive: true

advancement_gate:
  candidates: [p4_top_down_structure, p5_top_down_structure_fvg]
  require_zero_causality_failures: true
  minimum_trades_per_year: 60
  minimum_trades_per_session_replication: 30
  minimum_trades_per_direction_replication: 30
  require_positive_construction_expectancy: true
  require_positive_replication_expectancy: true
  require_positive_replication_expectancy_each_session: true
  require_positive_replication_expectancy_each_direction: true
  require_replication_profit_factor_above_one: true
  require_replication_opportunity_mean_ci_above_zero: true
  require_positive_stress_replication_expectancy: true
  maximum_best_month_share_of_positive_r: 0.50
  nearest_baseline:
    p4_top_down_structure: p3_m15_structure
    p5_top_down_structure_fvg: p4_top_down_structure
  require_positive_incremental_replication_opportunity_mean: true
